services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: career_domain_intelligence_platform
      MYSQL_USER: ${DB_USERNAME:?Set DB_USERNAME in your environment}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your environment}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in your environment}
    ports: ["3307:3306"]
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 10s
      timeout: 5s
      retries: 15
  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in your environment}
    ports: ["7474:7474", "7687:7687"]
    volumes: [neo4j-data:/data]
volumes:
  mysql-data:
  neo4j-data:
