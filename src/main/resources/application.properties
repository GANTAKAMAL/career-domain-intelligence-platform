spring.application.name=Career-Domain-Intelligence-Platform-using-Knowledge-Graphs-and-Machine-Learning

server.port=8080

# =========================================================
# MySQL
# =========================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/career_domain_intelligence_platform?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:career_app}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================================================
# JPA / Hibernate
# =========================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# =========================================================
# Neo4j
# =========================================================
spring.neo4j.uri=${NEO4J_URI:bolt://localhost:7687}
spring.neo4j.authentication.username=${NEO4J_USERNAME:neo4j}
# Neo4j credentials are deliberately not embedded in source control.
spring.neo4j.authentication.password=${NEO4J_PASSWORD:}

# =========================================================
# Authentication
# =========================================================
app.auth.secret=${APP_AUTH_SECRET:}
app.auth.expiration-hours=${APP_AUTH_EXPIRATION_HOURS:24}

# =========================================================
# CORS
# =========================================================
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# =========================================================
# Admin
# =========================================================
app.admin.email=${APP_ADMIN_EMAIL:admin@careerdomain.local}

# =========================================================
# Actuator
# =========================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# =========================================================
# Logging
# =========================================================
logging.level.org.springframework.security=INFO
logging.level.com.careerdomain=INFO
